[project]
name = "quant-research"
version = "0.1.0"
description = "Research tooling for perp-style and prediction markets (Hyperliquid, Polymarket)."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
capture = ["websockets>=12"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
hl-snapshot = "quant_research.perp.hl_forensics.cli.snapshot:main"
hl-ladder   = "quant_research.perp.hl_forensics.cli.ladder:main"
hl-probe    = "quant_research.perp.hl_forensics.cli.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
