[project]
name = "quant-research"
version = "0.2.0"
description = "Reusable research tooling (collect / compute / report) for perp-style and prediction markets."
requires-python = ">=3.10"
# polars is core: every compute step returns/consumes DataFrames (fast, columnar, joinable)
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
# live listeners (Hyperliquid wallet capture, Polymarket sports/book capture)
capture = ["websockets>=12"]
# plotting
analysis = ["numpy", "matplotlib"]

[dependency-groups]
dev = ["pytest>=8", "websockets>=12"]

[project.scripts]
# perp / Hyperliquid
hl-snapshot = "quant_research.perp.hl_forensics.cli.snapshot:main"
hl-ladder   = "quant_research.perp.hl_forensics.cli.ladder:main"
hl-probe    = "quant_research.perp.hl_forensics.cli.probe:main"
# prediction / Polymarket
pm-capture-sports = "quant_research.prediction.polymarket.cli.capture_sports:main"
pm-capture-books  = "quant_research.prediction.polymarket.cli.capture_books:main"
pm-tape-info      = "quant_research.prediction.polymarket.cli.tape_info:main"
pm-wallet         = "quant_research.prediction.polymarket.cli.wallet:main"
# scaffolding / index for the private lab repo (studies are written OUTSIDE this repo)
qr-new-study = "quant_research.scaffold:main"
qr-index     = "quant_research.lab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
